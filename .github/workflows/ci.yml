name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the PR merge commit and its base (version check)

      - name: Version bumped
        # A change to the addon must bump `## Version` in the .toc.
        if: github.event_name == 'pull_request'
        run: .github/scripts/check-version.sh HEAD^1

      - name: Install Lua tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-check lua-busted

      - name: Checks (luacheck, busted)
        # The same script as locally: tools/check.sh
        run: tools/check.sh --no-install
